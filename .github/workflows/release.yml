name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.9
    
    - name: Set version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
    
    - name: Create release package
      run: |
        # Create a zip file with the script and README
        zip -r theme-manager-${VERSION}.zip theme-manager.py README.md LICENSE theme_manager_config.sample.json
        
        # Make script executable
        chmod +x theme-manager.py
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${VERSION}
        draft: false
        prerelease: false
        body_path: CHANGELOG.md
        files: |
          theme-manager-${VERSION}.zip
          theme-manager.py
          theme_manager_config.sample.json
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}