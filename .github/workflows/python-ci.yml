name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install flake8 pytest pytest-cov
    
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Install Sass
      run: |
        npm install -g sass
    
    - name: Test with pytest
      run: |
        # Skip tests requiring OpenShift/environment access with -k
        pytest -k "not integration" --cov=. --cov-report=xml
      # When we add tests, we need to remove the 'if: false' line below
      if: false
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      # When we add tests, we need to remove the 'if: false' line below
      if: false
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        fail_ci_if_error: false

  build-package:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel
    
    - name: Build package
      run: |
        # This is a placeholder for building a package
        # python -m build
        
        # For now, just verify theme-manager.py is executable
        chmod +x theme-manager.py
        python -c "import theme-manager" || echo "Import failed, but that's expected for a script"
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: theme-manager-script
        path: theme-manager.py